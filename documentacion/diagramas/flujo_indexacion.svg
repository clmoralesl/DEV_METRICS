<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" width="1600" height="470" role="img" aria-label="Flujo de indexacion del pipeline RAG: de la API de GitHub al indice vectorial">
<title>Flujo de indexacion del pipeline RAG: de la API de GitHub al indice vectorial</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker>
</defs>
<style>
text{font-family:Segoe UI,Arial,Helvetica,sans-serif;fill:#1b1f23}
.t{font-size:20px;font-weight:700}
.t2{font-size:17px;font-weight:700}
.s{font-size:17px}
.l{font-size:16px;fill:#37474f;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.h{font-size:22px;font-weight:700;fill:#263238}
.k{font-size:15px;fill:#455a64}
</style>
<rect width="1600" height="470" fill="#ffffff"/>
<text x="800" y="40" class="h" text-anchor="middle">Fase 1: indexacion (offline, bajo demanda: /ingestar e /indexar, o scripts/consola.py ingestar e indexar)</text>
<rect x="30" y="70" width="270" height="140" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="165.0" y="98" class="t" text-anchor="middle">1 Ingesta</text>
<text x="165.0" y="123" class="s" text-anchor="middle">API de GitHub:</text>
<text x="165.0" y="145" class="s" text-anchor="middle">commits, PR, revisiones,</text>
<text x="165.0" y="167" class="s" text-anchor="middle">issues con paginacion;</text>
<text x="165.0" y="189" class="s" text-anchor="middle">cache en data/github</text>
<rect x="355" y="70" width="270" height="140" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="490.0" y="98" class="t" text-anchor="middle">2 Documentos</text>
<text x="490.0" y="123" class="s" text-anchor="middle">un documento por login,</text>
<text x="490.0" y="145" class="s" text-anchor="middle">repositorio y tipo de</text>
<text x="490.0" y="167" class="s" text-anchor="middle">fuente, con cabecera</text>
<text x="490.0" y="189" class="s" text-anchor="middle">de metadatos</text>
<path d="M300,140 L355,140" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="680" y="70" width="270" height="140" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="815.0" y="98" class="t" text-anchor="middle">3 Chunking</text>
<text x="815.0" y="123" class="s" text-anchor="middle">RecursiveCharacter</text>
<text x="815.0" y="145" class="s" text-anchor="middle">TextSplitter,</text>
<text x="815.0" y="167" class="s" text-anchor="middle">tamano 600 y</text>
<text x="815.0" y="189" class="s" text-anchor="middle">solapamiento 120</text>
<path d="M625,140 L680,140" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="1005" y="70" width="270" height="140" rx="9" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.2"/>
<text x="1140.0" y="98" class="t" text-anchor="middle">4 Embeddings</text>
<text x="1140.0" y="123" class="s" text-anchor="middle">MiniLM multilingue</text>
<text x="1140.0" y="145" class="s" text-anchor="middle">local: un vector</text>
<text x="1140.0" y="167" class="s" text-anchor="middle">por fragmento</text>
<path d="M950,140 L1005,140" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="1330" y="70" width="270" height="140" rx="9" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.2"/>
<text x="1465.0" y="98" class="t" text-anchor="middle">5 Indice Chroma</text>
<text x="1465.0" y="123" class="s" text-anchor="middle">metadatos: desarrollador,</text>
<text x="1465.0" y="145" class="s" text-anchor="middle">repositorio, tipo_fuente,</text>
<text x="1465.0" y="167" class="s" text-anchor="middle">fechas; indexado</text>
<text x="1465.0" y="189" class="s" text-anchor="middle">incremental e idempotente</text>
<path d="M1275,140 L1330,140" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#a)"/>
<text x="800" y="262" class="h" text-anchor="middle">Fuente interna (misma tuberia, indice propio)</text>
<rect x="30" y="285" width="270" height="120" rx="9" fill="#eceff1" stroke="#455a64" stroke-width="2.2"/>
<text x="165.0" y="313" class="t2" text-anchor="middle">A conocimiento/*.md</text>
<text x="165.0" y="338" class="s" text-anchor="middle">requerimientos, arquetipos</text>
<text x="165.0" y="360" class="s" text-anchor="middle">y criterios con metadatos</text>
<text x="165.0" y="382" class="s" text-anchor="middle">categoria, documento, titulo</text>
<rect x="355" y="285" width="270" height="120" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="490.0" y="313" class="t" text-anchor="middle">B Segmentacion</text>
<text x="490.0" y="338" class="s" text-anchor="middle">por secciones y tamano,</text>
<text x="490.0" y="360" class="s" text-anchor="middle">con la posicion del</text>
<text x="490.0" y="382" class="s" text-anchor="middle">fragmento en la cita</text>
<path d="M300,345 L355,345" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="680" y="285" width="270" height="120" rx="9" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.2"/>
<text x="815.0" y="313" class="t" text-anchor="middle">C Embeddings</text>
<text x="815.0" y="338" class="s" text-anchor="middle">el mismo modelo local</text>
<text x="815.0" y="360" class="s" text-anchor="middle">que la fuente externa</text>
<path d="M625,345 L680,345" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="1005" y="285" width="270" height="120" rx="9" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.2"/>
<text x="1140.0" y="313" class="t2" text-anchor="middle">D Indice conocimiento</text>
<text x="1140.0" y="338" class="s" text-anchor="middle">coleccion propia en Chroma;</text>
<text x="1140.0" y="360" class="s" text-anchor="middle">filtro por categoria</text>
<path d="M950,345 L1005,345" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#a)"/>
<text x="1390" y="345" class="k" text-anchor="start">Ambos indices se consultan</text>
<text x="1390" y="366" class="k" text-anchor="start">en la fase 2 (consulta).</text>
<text x="800" y="450" class="k" text-anchor="middle">Reindexar no duplica: cada grupo (desarrollador, repositorio, tipo) se compara por huella y solo se actualiza lo que cambio</text>
</svg>
