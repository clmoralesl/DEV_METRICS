<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Arquitectura de DevMetrics: fuentes, procesamiento, indices, recuperacion, generacion e interfaz">
<title>Arquitectura de DevMetrics: fuentes, procesamiento, indices, recuperacion, generacion e interfaz</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker>
</defs>
<style>
text{font-family:Segoe UI,Arial,Helvetica,sans-serif;fill:#1b1f23}
.t{font-size:20px;font-weight:700}
.t2{font-size:17px;font-weight:700}
.s{font-size:17px}
.l{font-size:16px;fill:#37474f;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.h{font-size:22px;font-weight:700;fill:#263238}
.k{font-size:15px;fill:#455a64}
</style>
<rect width="1600" height="800" fill="#ffffff"/>
<rect x="22" y="20" width="231" height="745" rx="10" fill="#eceff1" opacity="0.55"/>
<text x="137.5" y="52" class="h" text-anchor="middle">Fuentes</text>
<rect x="287" y="20" width="231" height="745" rx="10" fill="#e3f2fd" opacity="0.55"/>
<text x="402.5" y="52" class="h" text-anchor="middle">Procesamiento</text>
<rect x="552" y="20" width="231" height="745" rx="10" fill="#e8eaf6" opacity="0.55"/>
<text x="667.5" y="52" class="h" text-anchor="middle">Indices vectoriales</text>
<rect x="817" y="20" width="231" height="745" rx="10" fill="#e8f5e9" opacity="0.55"/>
<text x="932.5" y="52" class="h" text-anchor="middle">Recuperacion</text>
<rect x="1082" y="20" width="231" height="745" rx="10" fill="#fff3e0" opacity="0.55"/>
<text x="1197.5" y="52" class="h" text-anchor="middle">Generacion</text>
<rect x="1347" y="20" width="231" height="745" rx="10" fill="#f3e5f5" opacity="0.55"/>
<text x="1462.5" y="52" class="h" text-anchor="middle">Interfaz</text>
<rect x="30" y="120" width="215" height="100" rx="9" fill="#eceff1" stroke="#455a64" stroke-width="2.2"/>
<text x="137.5" y="148" class="t" text-anchor="middle">API de GitHub</text>
<text x="137.5" y="173" class="s" text-anchor="middle">commits, PR, revisiones</text>
<text x="137.5" y="195" class="s" text-anchor="middle">e issues (publicos)</text>
<rect x="30" y="410" width="215" height="110" rx="9" fill="#eceff1" stroke="#455a64" stroke-width="2.2"/>
<text x="137.5" y="438" class="t" text-anchor="middle">conocimiento/*.md</text>
<text x="137.5" y="463" class="s" text-anchor="middle">requerimientos,</text>
<text x="137.5" y="485" class="s" text-anchor="middle">arquetipos y criterios</text>
<text x="137.5" y="507" class="s" text-anchor="middle">(base ficticia)</text>
<rect x="295" y="110" width="215" height="120" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="402.5" y="138" class="t" text-anchor="middle">ingesta</text>
<text x="402.5" y="163" class="s" text-anchor="middle">cliente con paginacion</text>
<text x="402.5" y="185" class="s" text-anchor="middle">y limite de tasa, cache</text>
<text x="402.5" y="207" class="s" text-anchor="middle">en data/github</text>
<rect x="295" y="260" width="215" height="120" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="402.5" y="288" class="t" text-anchor="middle">perfiles</text>
<text x="402.5" y="313" class="s" text-anchor="middle">documentos por login,</text>
<text x="402.5" y="335" class="s" text-anchor="middle">repo y tipo de fuente;</text>
<text x="402.5" y="357" class="s" text-anchor="middle">chunking 600/120</text>
<rect x="295" y="410" width="215" height="110" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="402.5" y="438" class="t" text-anchor="middle">conocimiento</text>
<text x="402.5" y="463" class="s" text-anchor="middle">carga, validacion y</text>
<text x="402.5" y="485" class="s" text-anchor="middle">segmentacion de los</text>
<text x="402.5" y="507" class="s" text-anchor="middle">documentos internos</text>
<rect x="295" y="630" width="215" height="110" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="402.5" y="658" class="t" text-anchor="middle">arquetipos</text>
<text x="402.5" y="683" class="s" text-anchor="middle">senales de actividad y</text>
<text x="402.5" y="705" class="s" text-anchor="middle">perfil por reglas (mezcla</text>
<text x="402.5" y="727" class="s" text-anchor="middle">y confianza)</text>
<rect x="560" y="110" width="215" height="120" rx="9" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.2"/>
<text x="667.5" y="138" class="t" text-anchor="middle">Embeddings</text>
<text x="667.5" y="163" class="s" text-anchor="middle">MiniLM multilingue</text>
<text x="667.5" y="185" class="s" text-anchor="middle">local (ModeloEmbeddings)</text>
<text x="667.5" y="207" class="s" text-anchor="middle">para ambos indices</text>
<rect x="560" y="260" width="215" height="120" rx="9" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.2"/>
<text x="667.5" y="288" class="t" text-anchor="middle">Indice perfiles</text>
<text x="667.5" y="313" class="s" text-anchor="middle">Chroma con metadatos:</text>
<text x="667.5" y="335" class="s" text-anchor="middle">desarrollador, repo,</text>
<text x="667.5" y="357" class="s" text-anchor="middle">tipo y fechas</text>
<rect x="560" y="410" width="215" height="110" rx="9" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.2"/>
<text x="667.5" y="438" class="t2" text-anchor="middle">Indice conocimiento</text>
<text x="667.5" y="463" class="s" text-anchor="middle">Chroma, categoria</text>
<text x="667.5" y="485" class="s" text-anchor="middle">requerimiento, arquetipo</text>
<text x="667.5" y="507" class="s" text-anchor="middle">o criterio</text>
<rect x="825" y="110" width="215" height="120" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
<text x="932.5" y="138" class="t" text-anchor="middle">consulta en vivo</text>
<text x="932.5" y="163" class="s" text-anchor="middle">GitHub bajo demanda si</text>
<text x="932.5" y="185" class="s" text-anchor="middle">el login filtrado no esta</text>
<text x="932.5" y="207" class="s" text-anchor="middle">indexado (--repos)</text>
<rect x="825" y="260" width="215" height="190" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
<text x="932.5" y="288" class="t2" text-anchor="middle">RecuperadorCombinado</text>
<text x="932.5" y="313" class="s" text-anchor="middle">k interna 2, externa 4</text>
<text x="932.5" y="335" class="s" text-anchor="middle">filtros por metadatos</text>
<text x="932.5" y="357" class="s" text-anchor="middle">mezcla por distancia</text>
<text x="932.5" y="379" class="s" text-anchor="middle">cita de origen y avisos</text>
<text x="932.5" y="401" class="s" text-anchor="middle">si una fuente cae, la</text>
<text x="932.5" y="423" class="s" text-anchor="middle">otra responde</text>
<rect x="1090" y="260" width="215" height="190" rx="9" fill="#fff3e0" stroke="#e65100" stroke-width="2.2"/>
<text x="1197.5" y="288" class="t" text-anchor="middle">Conversacion</text>
<text x="1197.5" y="313" class="s" text-anchor="middle">memoria de ventana (6)</text>
<text x="1197.5" y="335" class="s" text-anchor="middle">prompt sistema v1.1.0</text>
<text x="1197.5" y="357" class="s" text-anchor="middle">con contexto recuperado</text>
<text x="1197.5" y="379" class="s" text-anchor="middle">sin fragmentos: evidencia</text>
<text x="1197.5" y="401" class="s" text-anchor="middle">insuficiente, sin LLM</text>
<rect x="1090" y="490" width="215" height="110" rx="9" fill="#fff3e0" stroke="#e65100" stroke-width="2.2"/>
<text x="1197.5" y="518" class="t" text-anchor="middle">ClienteLLM</text>
<text x="1197.5" y="543" class="s" text-anchor="middle">Gemini principal,</text>
<text x="1197.5" y="565" class="s" text-anchor="middle">Ollama de respaldo;</text>
<text x="1197.5" y="587" class="s" text-anchor="middle">invocar y flujo</text>
<rect x="1090" y="630" width="215" height="110" rx="9" fill="#fff3e0" stroke="#e65100" stroke-width="2.2" stroke-dasharray="8 5"/>
<text x="1197.5" y="658" class="t" text-anchor="middle">clasificar</text>
<text x="1197.5" y="683" class="s" text-anchor="middle">mezcla, confianza y</text>
<text x="1197.5" y="705" class="s" text-anchor="middle">razonamiento validados</text>
<text x="1197.5" y="727" class="s" text-anchor="middle">(sin conectar al chat)</text>
<rect x="1355" y="110" width="215" height="90" rx="9" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.2"/>
<text x="1462.5" y="138" class="t" text-anchor="middle">Usuario</text>
<text x="1462.5" y="163" class="s" text-anchor="middle">reclutador o lider</text>
<text x="1462.5" y="185" class="s" text-anchor="middle">de proyecto</text>
<rect x="1355" y="260" width="215" height="190" rx="9" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.2"/>
<text x="1462.5" y="288" class="t" text-anchor="middle">consola</text>
<text x="1462.5" y="313" class="s" text-anchor="middle">REPL con streaming</text>
<text x="1462.5" y="335" class="s" text-anchor="middle">/desarrollador /reiniciar</text>
<text x="1462.5" y="357" class="s" text-anchor="middle">/ingestar /indexar</text>
<text x="1462.5" y="379" class="s" text-anchor="middle">chat --simulado,</text>
<text x="1462.5" y="401" class="s" text-anchor="middle">--pregunta</text>
