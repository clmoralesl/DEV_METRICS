<text x="1450" y="646" class="k" text-anchor="start">flujo conectado</text>
<path d="M1360,680 L1440,680" fill="none" stroke="#78909c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#g)"/>
<text x="1450" y="686" class="k" text-anchor="start">implementado,</text>
<text x="1450" y="706" class="k" text-anchor="start">no conectado al chat</text>
<text x="800" y="790" class="k" text-anchor="middle">DevMetrics: agente RAG que perfila desarrolladores como mezcla de Druid, Cleric y Bard a partir de metadatos publicos de GitHub</text>
