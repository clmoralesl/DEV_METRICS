[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devmetrics"
version = "0.1.0"
description = "Agente LLM y pipeline RAG para perfilar desarrolladores por arquetipos"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "requests",
    "httpx",
    "langchain-core>=1.7.5,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-ollama>=1.1,<2",
    "fastembed>=0.9,<1",
    "langchain-text-splitters>=1.1,<2",
    "truststore",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
"devmetrics.arquetipos" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
