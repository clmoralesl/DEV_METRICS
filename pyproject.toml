[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devmetrics"
version = "0.1.0"
description = "Agente LLM y pipeline RAG para perfilar desarrolladores por arquetipos"
requires-python = ">=3.11"
dependencies = ["python-dotenv", "requests"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
